# Free Supabase projects pause after about a week without database activity.
# This runs a tiny read twice a week so the website's database stays awake.
# Costs nothing: GitHub Actions is free for this.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4' # Mondays and Thursdays, 07:17 Lagos time
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        env:
          # Public values (already built into the website); safe to keep here.
          SUPABASE_URL: https://pivoigacuyuzfvdtlybn.supabase.co
          SUPABASE_KEY: sb_publishable_ks4Lr9DcSptI6c1wCqANbA_K8JryBBd
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/publications?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase answered with HTTP $code"
          test "$code" = "200"
